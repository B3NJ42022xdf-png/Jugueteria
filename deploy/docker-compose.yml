# Alta disponibilidad y escalado horizontal.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#   curl http://localhost:8080/health
#
# Escalar a 4 réplicas (Nginx las descubre solo, sin reiniciar):
#   docker compose -f deploy/docker-compose.yml up -d --scale app=4
#
# Ajustar el valor por defecto sin usar --scale:
#   APP_REPLICAS=3 docker compose -f deploy/docker-compose.yml up -d
#
# Activar mantenimiento:
#   docker compose -f deploy/docker-compose.yml exec nginx touch /etc/nginx/maintenance.on
# Retirarlo:
#   docker compose -f deploy/docker-compose.yml exec nginx rm /etc/nginx/maintenance.on

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: "3000"
    APP_VERSION: ${APP_VERSION:-1.0.0}
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  restart: always
  stop_grace_period: 15s
  expose:
    - "3000"
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:3000/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
      ]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 15s
  deploy:
    # Cada réplica atiende su propio proceso Node; el balanceador reparte con
    # least_conn. Con APP_REPLICAS=4 se cubren picos de 500+ compradores.
    replicas: ${APP_REPLICAS:-2}
    resources:
      limits:
        cpus: "1.0"
        memory: 512M

services:
  app:
    <<: *app

  nginx:
    image: nginx:1.27.5-alpine
    container_name: jugueteria-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../public/mantenimiento.html:/usr/share/nginx/html/mantenimiento.html:ro
    depends_on:
      app:
        condition: service_healthy
