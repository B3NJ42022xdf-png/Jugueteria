# Nginx · balanceador de carga y página de mantenimiento
#
# Se usa como /etc/nginx/nginx.conf en Docker Compose. Para instalaciones
# nativas, copia solo el bloque `resolver`, `upstream` y `server` dentro de tu
# http {} y ajusta el resolver a tu DNS del sistema.
#
# Escalado horizontal:
#   docker compose -f deploy/docker-compose.yml up -d --scale app=4
# Nginx descubre las réplicas nuevas mediante Docker DNS y `resolve`, sin
# necesidad de reiniciar el contenedor del balanceador.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
  # 4096 conexiones por worker permite miles de navegadores simultáneos.
  worker_connections 4096;
  multi_accept on;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile            on;
  tcp_nopush          on;
  tcp_nodelay         on;
  keepalive_timeout   65;
  keepalive_requests  1000;
  server_tokens       off;
  client_max_body_size 2m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout        30s;
  reset_timedout_connection on;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript
             application/xml image/svg+xml;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$upstream_addr" "$request_time"';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # Protege los endpoints de escritura (/api/*) de ráfagas abusivas sin
  # afectar la navegación normal de los 500 compradores concurrentes.
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;

  # Docker DNS: 127.0.0.11 resuelve el nombre del servicio "app" a todas sus
  # réplicas. `resolve` refresca la lista cada 10 s al escalar o reiniciar.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream jugueteria_app {
    zone jugueteria_app 64k;
    least_conn;
    server app:3000 resolve max_fails=3 fail_timeout=15s;
    keepalive 64;
  }

  server {
    listen 80;
    server_name _;

    # Activa el mantenimiento creando este archivo:
    #   touch /etc/nginx/maintenance.on
    # Retíralo para volver a operar.
    set $maintenance 0;
    if (-f /etc/nginx/maintenance.on) {
      set $maintenance 1;
    }

    # El healthcheck nunca se bloquea: los monitores deben poder consultarlo.
    location = /health {
      proxy_pass http://jugueteria_app/health;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
      add_header Cache-Control "no-store" always;
    }

    location /assets/ {
      if ($maintenance = 1) {
        return 503;
      }

      proxy_pass http://jugueteria_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Endpoints que mutan estado: límite por IP con ráfaga de 60 peticiones.
    location /api/ {
      if ($maintenance = 1) {
        return 503;
      }

      limit_req zone=api_per_ip burst=60 nodelay;
      limit_req_status 429;

      proxy_pass http://jugueteria_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 3s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 10s;
    }

    location / {
      if ($maintenance = 1) {
        return 503;
      }

      proxy_pass http://jugueteria_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;

      proxy_connect_timeout 3s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;

      # Si una réplica falla, reintenta en la otra antes de mostrar error.
      proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 10s;
    }

    error_page 502 503 504 = @maintenance;

    location @maintenance {
      internal;
      root /usr/share/nginx/html;
      try_files /mantenimiento.html =503;
    }

    location = /sw.js {
      proxy_pass http://jugueteria_app/sw.js;
      add_header Cache-Control "no-cache" always;
    }
  }
}
